Python:
  - changed-files:
      - any-glob-to-any-file:
          - src/VisualizePhonon/**/*
          - pyproject.toml
          - setup.py
Docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**/*
