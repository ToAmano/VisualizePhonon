[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "VisualizePhonon"
dynamic = ["version"]
description = "A tool for analyzing vibrational modes from VASP OUTCAR files"
readme = "README.md"
authors = [
    {name = "Tomohito Amano", email = "amanotomohito040@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "ase>=3.22.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
]
vesta = [
    "pymatgen>=2022.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[project.scripts]
vaspvis = "VisualizePhonon.cmdline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/VisualizePhonon"]

[tool.hatch.version]
path = "src/VisualizePhonon/__init__.py"
